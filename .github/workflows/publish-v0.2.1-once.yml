name: Publish v0.2.1 once

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event.head_commit.message == 'publish npm v0.2.1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.2.1
        uses: actions/checkout@v6
        with:
          ref: v0.2.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: |
          test "$(node -p "require('./package.json').name")" = "@vinggit/root-index-panels"
          test "$(node -p "require('./package.json').version")" = "0.2.1"

      - name: Build
        run: npm run build

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view @vinggit/root-index-panels@0.2.1 version >/dev/null 2>&1; then
            echo "@vinggit/root-index-panels@0.2.1 already published"
          else
            npm publish --access public --provenance
          fi

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.1 >/dev/null 2>&1; then
            echo "GitHub release v0.2.1 already exists"
          else
            gh release create v0.2.1 --verify-tag --generate-notes --title v0.2.1
          fi
