name: Temporary filename-sort build

on:
  pull_request:
    branches: ["main"]

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload generated dist
        uses: actions/upload-artifact@v4
        with:
          name: filename-sort-final-dist
          path: dist/
          if-no-files-found: error
