name: Temporary filename-sort build

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Build
        run: npm run build

      - name: Commit generated dist when needed
        shell: bash
        run: |
          if git diff --quiet -- dist/; then
            echo "dist/ is already synchronized"
            exit 0
          fi

          git config user.name VingGit
          git config user.email 61470249+VingGit@users.noreply.github.com
          git add dist/
          git commit -m "build: synchronize filename sorting dist"
          git push origin "HEAD:${{ github.head_ref }}"
