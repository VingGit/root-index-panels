name: Prepare Windows tooling release

on:
  push:
    branches: ["fix/windows-icon-tools"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message != 'prepare generated release artifacts'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/windows-icon-tools

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Regenerate icon artifacts
        run: npm run icons:generate

      - name: Format changed files
        run: |
          npx prettier --write package.json package-lock.json CHANGELOG.md README.md scripts/add-icon.mjs scripts/check-packed-package.mjs src/built-in-icons.json src/built-in-icons.generated.ts

      - name: Verify icon helper
        run: npm run icon:add -- file-question-mark

      - name: Verify package
        run: |
          npm run check
          npm run build
          npm run verify:dist
          npm run verify:package
          npm pack --dry-run
          git diff --check

      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name VingGit
          git config user.email 61470249+VingGit@users.noreply.github.com
          git add package-lock.json README.md src/built-in-icons.generated.ts dist
          git commit -m "prepare generated release artifacts"
          git push origin HEAD:fix/windows-icon-tools
