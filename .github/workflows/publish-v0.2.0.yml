name: Publish v0.2.0

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.head_commit.message == 'publish v0.2.0 package'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: v0.2.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish if absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="@quartz-community/root-index-panels@0.2.0"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already published"
          else
            npm publish --access public
          fi
