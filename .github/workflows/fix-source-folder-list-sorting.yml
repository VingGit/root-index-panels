name: Fix source-folder filename list sorting

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-source-folder-list-sorting.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply source-folder sorting fix
        shell: bash
        run: |
          cat > src/filenameListSorting.ts <<'EOF'
          import type { FullSlug, QuartzPluginData } from "@quartz-community/types"

          import {
            filenameSortName,
            normalizeFilenameSortDirection,
            type FilenameSortDirection,
          } from "./filenameSorting"
          import { parseCanonicalSlug } from "./slug"

          type PluginFile = QuartzPluginData & Record<string, unknown>

          export interface FilenameSortSource {
            slug: FullSlug
            sortName: string
            folderKey: string
            direction?: FilenameSortDirection
          }

          export interface FilenameListSortData {
            sources: readonly FilenameSortSource[]
          }

          function ownDataValue(value: unknown, key: string): unknown {
            try {
              if (typeof value !== "object" || value === null || Array.isArray(value)) return undefined
              const descriptor = Object.getOwnPropertyDescriptor(value, key)
              return descriptor && "value" in descriptor ? descriptor.value : undefined
            } catch {
              return undefined
            }
          }

          function safeFiles(value: unknown): PluginFile[] {
            try {
              if (!Array.isArray(value)) return []
            } catch {
              return []
            }

            const files: PluginFile[] = []
            let length = 0
            try {
              length = value.length
            } catch {
              return files
            }

            for (let index = 0; index < length; index += 1) {
              let file: unknown
              try {
                file = value[index]
              } catch {
                continue
              }
              if (typeof file === "object" && file !== null && !Array.isArray(file)) {
                files.push(file as PluginFile)
              }
            }
            return files
          }

          function isListedPhysical(file: PluginFile): boolean {
            const filePath = ownDataValue(file, "filePath")
            return (
              typeof filePath === "string" && filePath.length > 0 && ownDataValue(file, "unlisted") !== true
            )
          }

          function fileSortDirection(file: PluginFile): FilenameSortDirection | undefined {
            const frontmatter = ownDataValue(file, "frontmatter")
            return normalizeFilenameSortDirection(ownDataValue(frontmatter, "quartz-sorting-direction"))
          }

          /**
           * Build the physical filename index used by note-list components. Every source note is
           * associated with the policy from the physical index.md in its own containing folder.
           * Policies never inherit into nested folders.
           */
          export function collectFilenameListSortData(allFiles: unknown): FilenameListSortData {
            const seenFolders = new Set<string>()
            const folderDirections = new Map<string, FilenameSortDirection>()
            const seenSources = new Set<string>()
            const sources: Array<Omit<FilenameSortSource, "direction">> = []

            for (const file of safeFiles(allFiles)) {
              const parsed = parseCanonicalSlug(ownDataValue(file, "slug"))
              if (!parsed || !isListedPhysical(file)) continue

              if (parsed.parts.at(-1) === "index") {
                const folderKey = parsed.parts.slice(0, -1).join("/")
                if (!seenFolders.has(folderKey)) {
                  seenFolders.add(folderKey)
                  const direction = fileSortDirection(file)
                  if (direction) folderDirections.set(folderKey, direction)
                }
              }

              if (seenSources.has(parsed.slug)) continue
              seenSources.add(parsed.slug)
              const filePath = ownDataValue(file, "filePath")
              const fallbackSegment = parsed.parts.at(-1)
              if (typeof filePath !== "string" || !fallbackSegment) continue
              sources.push({
                slug: parsed.slug,
                sortName: filenameSortName(filePath, fallbackSegment),
                folderKey: parsed.parts.slice(0, -1).join("/"),
              })
            }

            return Object.freeze({
              sources: Object.freeze(
                sources.map((source) => {
                  const direction = folderDirections.get(source.folderKey)
                  return Object.freeze({
                    ...source,
                    ...(direction ? { direction } : {}),
                  })
                }),
              ),
            })
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/RootIndexSidebar.tsx")
          text = path.read_text()
          old = '''    const filenameListData = collectFilenameListSortData(props.allFiles, current)
              const noteListSortDirection =
                current === "tags" || current.startsWith("tags/")
                  ? filenameListData.rootDirection
                  : filenameListData.pageDirection
              const filenameSortIndex = noteListSortDirection
                ? JSON.stringify(
                    filenameListData.sources.map((source) => [
                      resolveRelative(current, source.slug),
                      source.sortName,
                    ]),
                  )
                : undefined
          '''
          new = '''    const filenameListData = collectFilenameListSortData(props.allFiles)
              const sortableFilenameSources = filenameListData.sources.filter(
                (source) => source.direction !== undefined,
              )
              const filenameSortIndex =
                sortableFilenameSources.length > 0
                  ? JSON.stringify(
                      sortableFilenameSources.map((source) => [
                        resolveRelative(current, source.slug),
                        source.sortName,
                        source.folderKey,
                        source.direction,
                      ]),
                    )
                  : undefined
          '''
          if old not in text:
              raise SystemExit("RootIndexSidebar context block not found")
          text = text.replace(old, new)
          text = text.replace('        data-rip-list-sort-direction={noteListSortDirection}\n', '')
          path.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/components/scripts/sidebar.inline.ts")
          text = path.read_text()
          marker = "function compactExplorerIsActive(): boolean {"
          if marker not in text:
              raise SystemExit("sidebar marker not found")
          suffix = text[text.index(marker):]
          prefix = r'''import {
            compareFilenameSortNames,
            normalizeFilenameSortDirection,
            type FilenameSortDirection,
          } from "../../filenameSorting"

          // RootIndexSidebar keeps all navigation as ordinary SSR links. JavaScript only
          // enhances book switcher dismissal, compact Explorer dismissal, independent folder
          // disclosures, and filename ordering for compatible Quartz note-list components.

          interface FilenameListSortEntry {
            sortName: string
            folderKey: string
            direction: FilenameSortDirection
          }

          interface FilenameListSortContext {
            index: Map<string, FilenameListSortEntry>
          }

          function normalizedListHref(href: string): string | undefined {
            try {
              const path = new URL(href, document.baseURI).pathname.replace(/\/+$/, "")
              return path.length > 0 ? path : "/"
            } catch {
              return undefined
            }
          }

          function readFilenameListSortContext(): FilenameListSortContext | undefined {
            const sidebar = document.querySelector<HTMLElement>(
              ".rip-sidebar[data-rip-filename-sort-index]",
            )
            if (!sidebar) return undefined

            const rawIndex = sidebar.dataset.ripFilenameSortIndex
            if (!rawIndex) return undefined

            let parsed: unknown
            try {
              parsed = JSON.parse(rawIndex)
            } catch {
              return undefined
            }
            if (!Array.isArray(parsed)) return undefined

            const index = new Map<string, FilenameListSortEntry>()
            for (const entry of parsed) {
              if (!Array.isArray(entry) || entry.length !== 4) continue
              const [href, sortName, folderKey, rawDirection] = entry
              const direction = normalizeFilenameSortDirection(rawDirection)
              if (
                typeof href !== "string" ||
                typeof sortName !== "string" ||
                typeof folderKey !== "string" ||
                !direction
              ) {
                continue
              }
              const value = { sortName, folderKey, direction }
              index.set(href, value)
              const normalized = normalizedListHref(href)
              if (normalized) index.set(normalized, value)
            }
            if (index.size === 0) return undefined

            return { index }
          }

          function listItemSortEntry(
            item: Element,
            index: ReadonlyMap<string, FilenameListSortEntry>,
          ): FilenameListSortEntry | undefined {
            const link = item.querySelector<HTMLAnchorElement>("a.internal[href]:not(.tag-link)")
            const href = link?.getAttribute("href")
            if (!href) return undefined

            const direct = index.get(href)
            if (direct !== undefined) return direct
            const normalized = normalizedListHref(href)
            return normalized ? index.get(normalized) : undefined
          }

          function sortFilenameList(
            list: HTMLUListElement,
            index: ReadonlyMap<string, FilenameListSortEntry>,
          ) {
            const children = Array.from(list.children)
            const groups = new Map<
              string,
              {
                direction: FilenameSortDirection
                sortable: Array<{ element: Element; position: number; sortName: string }>
              }
            >()

            for (let position = 0; position < children.length; position += 1) {
              const element = children[position]!
              const entry = listItemSortEntry(element, index)
              if (!entry) continue
              const group = groups.get(entry.folderKey) ?? {
                direction: entry.direction,
                sortable: [],
              }
              group.sortable.push({ element, position, sortName: entry.sortName })
              groups.set(entry.folderKey, group)
            }

            const nextChildren = [...children]
            for (const group of groups.values()) {
              if (group.sortable.length < 2) continue
              const ordered = [...group.sortable].sort((left, right) => {
                const compared = compareFilenameSortNames(
                  left.sortName,
                  right.sortName,
                  group.direction,
                )
                return compared !== 0 ? compared : left.position - right.position
              })
              for (let slot = 0; slot < group.sortable.length; slot += 1) {
                nextChildren[group.sortable[slot]!.position] = ordered[slot]!.element
              }
            }
            for (const child of nextChildren) list.append(child)
          }

          function initFilenameListSorting() {
            const context = readFilenameListSortContext()
            if (!context) return

            const lists = document.querySelectorAll<HTMLUListElement>(".backlinks > ul, ul.section-ul")
            for (const list of lists) {
              sortFilenameList(list, context.index)
            }
          }

          '''
          path.write_text(prefix + suffix)
          PY

          cat > test/filename-list-sorting.test.ts <<'EOF'
          import { describe, expect, it } from "vitest"

          import { collectFilenameListSortData } from "../src/filenameListSorting"
          import { physicalFile, virtualFile } from "./helpers"

          describe("filename list sorting context", () => {
            it("attaches each source note to its own exact folder policy without inheritance", () => {
              const files = [
                physicalFile("index", { "quartz-sorting-direction": "descending" }),
                physicalFile("root-note"),
                physicalFile("book/index", { "quartz-sorting-direction": "ascending" }),
                physicalFile("book/topic"),
                physicalFile("book/child/index", { title: "Child" }),
                physicalFile("book/child/topic"),
              ]

              const data = collectFilenameListSortData(files)
              expect(data.sources).toEqual([
                { slug: "index", sortName: "index", folderKey: "", direction: "descending" },
                {
                  slug: "root-note",
                  sortName: "root-note",
                  folderKey: "",
                  direction: "descending",
                },
                {
                  slug: "book/index",
                  sortName: "index",
                  folderKey: "book",
                  direction: "ascending",
                },
                {
                  slug: "book/topic",
                  sortName: "topic",
                  folderKey: "book",
                  direction: "ascending",
                },
                { slug: "book/child/index", sortName: "index", folderKey: "book/child" },
                { slug: "book/child/topic", sortName: "topic", folderKey: "book/child" },
              ])
            })

            it("uses a backlink source folder policy even when the viewed page is elsewhere", () => {
              const data = collectFilenameListSortData([
                physicalFile("overview", { title: "Diary overview" }),
                physicalFile("diary/index", { "quartz-sorting-direction": "ascending" }),
                physicalFile(
                  "diary/entry-one",
                  {},
                  { filePath: "diary/16.09.2026_at_13-36_Untitled.md" },
                ),
                physicalFile(
                  "diary/entry-two",
                  {},
                  { filePath: "diary/16.09.2026_at_12-00_Untitled.md" },
                ),
              ])

              expect(data.sources.find((source) => source.slug === "overview")?.direction).toBeUndefined()
              expect(data.sources.find((source) => source.slug === "diary/entry-one")).toMatchObject({
                folderKey: "diary",
                direction: "ascending",
              })
              expect(data.sources.find((source) => source.slug === "diary/entry-two")).toMatchObject({
                folderKey: "diary",
                direction: "ascending",
              })
            })

            it("indexes listed physical source filenames and ignores virtual or unlisted records", () => {
              const files = [
                physicalFile("book/index", { "quartz-sorting-direction": "ascending" }),
                physicalFile(
                  "book/permalink-like-slug",
                  {},
                  { filePath: "book/16.09.2026_at_13-36_Untitled.md" },
                ),
                physicalFile("book/private", {}, { unlisted: true }),
                virtualFile("book/generated.canvas", {}, { canvasData: true }),
              ]

              const data = collectFilenameListSortData(files)
              expect(data.sources).toEqual([
                {
                  slug: "book/index",
                  sortName: "index",
                  folderKey: "book",
                  direction: "ascending",
                },
                {
                  slug: "book/permalink-like-slug",
                  sortName: "16.09.2026_at_13-36_Untitled",
                  folderKey: "book",
                  direction: "ascending",
                },
              ])
              expect(Object.isFrozen(data)).toBe(true)
              expect(Object.isFrozen(data.sources)).toBe(true)
            })

            it("uses only the first listed physical index policy for a folder", () => {
              const data = collectFilenameListSortData([
                physicalFile("book/index", { "quartz-sorting-direction": "ascending" }),
                physicalFile("book/index", { "quartz-sorting-direction": "descending" }),
                physicalFile("book/topic"),
              ])

              expect(data.sources.find((source) => source.slug === "book/topic")?.direction).toBe(
                "ascending",
              )
            })
          })
          EOF

          cat > test/list-sorting-script.test.ts <<'EOF'
          // @vitest-environment happy-dom

          import { beforeEach, describe, expect, it } from "vitest"

          import { initRootIndexSidebar } from "../src/components/scripts/sidebar.inline"

          type SortEntry = [
            href: string,
            sortName: string,
            folderKey: string,
            direction: "ascending" | "descending",
          ]

          function mountContext(entries: SortEntry[]) {
            const sidebar = document.createElement("nav")
            sidebar.className = "rip-sidebar"
            sidebar.dataset.ripFilenameSortIndex = JSON.stringify(entries)
            document.body.append(sidebar)
          }

          function mountBacklinks(items: Array<[href: string, label: string]>): HTMLUListElement {
            const wrapper = document.createElement("div")
            wrapper.className = "backlinks"
            const list = document.createElement("ul")
            for (const [href, label] of items) {
              const item = document.createElement("li")
              item.innerHTML = `<a class="internal" href="${href}">${label}</a>`
              list.append(item)
            }
            const end = document.createElement("li")
            end.className = "overflow-end"
            list.append(end)
            wrapper.append(list)
            document.body.append(wrapper)
            return list
          }

          function hrefs(list: HTMLUListElement): Array<string | null> {
            return Array.from(list.children)
              .filter((item) => !item.classList.contains("overflow-end"))
              .map((item) => item.querySelector("a")?.getAttribute("href") ?? null)
          }

          beforeEach(() => {
            document.body.replaceChildren()
            window.history.replaceState({}, "", "/overview")
          })

          describe("shared Quartz filename list sorting", () => {
            it("sorts Backlinks by the backlink source folder policy, not the viewed page", () => {
              mountContext([
                ["./number", "2Thing", "diary", "ascending"],
                ["./letter", "Apple", "diary", "ascending"],
                ["./later", "17.09.2026_at_08-00_Foo", "diary", "ascending"],
                ["./dt13", "16.09.2026_at_13-36_Untitled", "diary", "ascending"],
                ["./dt12", "16.09.2026_at_12-00_Zulu", "diary", "ascending"],
                ["./date", "16.09.2026_Untitled", "diary", "ascending"],
                ["./time", "13-36_Untitled", "diary", "ascending"],
              ])
              const list = mountBacklinks([
                ["./time", "A title"],
                ["./later", "B title"],
                ["./date", "C title"],
                ["./dt13", "D title"],
                ["./letter", "Z title"],
                ["./dt12", "E title"],
                ["./number", "Y title"],
              ])

              initRootIndexSidebar()

              expect(hrefs(list)).toEqual([
                "./number",
                "./letter",
                "./dt12",
                "./dt13",
                "./later",
                "./date",
                "./time",
              ])
              expect(list.lastElementChild?.classList.contains("overflow-end")).toBe(true)
            })

            it("uses each source folder direction independently in a mixed Backlinks list", () => {
              mountContext([
                ["./a-late", "17.09.2026_A", "folder-a", "ascending"],
                ["./a-early", "16.09.2026_A", "folder-a", "ascending"],
                ["./b-alpha", "Apple", "folder-b", "descending"],
                ["./b-zulu", "Zulu", "folder-b", "descending"],
              ])
              const list = mountBacklinks([
                ["./a-late", "A late"],
                ["./b-alpha", "B alpha"],
                ["./a-early", "A early"],
                ["./b-zulu", "B zulu"],
              ])

              initRootIndexSidebar()

              expect(hrefs(list)).toEqual(["./a-early", "./b-zulu", "./a-late", "./b-alpha"])
            })

            it("sorts Quartz PageList note slots while preserving unknown generated entries", () => {
              mountContext([
                ["./later", "17.09.2026_at_08-00_Later", "book", "ascending"],
                ["./earlier", "16.09.2026_at_08-00_Earlier", "book", "ascending"],
              ])
              const list = document.createElement("ul")
              list.className = "section-ul"
              list.innerHTML = `
                <li data-fixed="folder"><a class="internal" href="./folder/index">Folder</a></li>
                <li><a class="internal" href="./later">Later</a></li>
                <li data-fixed="generated"><span>Generated entry</span></li>
                <li><a class="internal" href="./earlier">Earlier</a></li>
              `
              document.body.append(list)

              initRootIndexSidebar()

              expect(
                Array.from(list.children).map(
                  (item) => item.getAttribute("data-fixed") ?? item.querySelector("a")?.getAttribute("href"),
                ),
              ).toEqual(["folder", "./earlier", "generated", "./later"])
            })

            it("leaves Backlinks and PageList order untouched without a source-folder policy", () => {
              const list = mountBacklinks([
                ["./later", "Later"],
                ["./earlier", "Earlier"],
              ])

              initRootIndexSidebar()

              expect(hrefs(list)).toEqual(["./later", "./earlier"])
            })
          })
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          old = '''Use `descending` to reverse values within each sort class. Putting the key on `content/index.md`
          controls root-level notes. A nested folder does not inherit its parent's setting; give that folder's
          own physical `index.md` the key when it should use the same behavior. Folder rows themselves remain
          first and keep their normal alphabetical ordering.
          '''
          new = '''Use `descending` to reverse values within each sort class. Putting the key on `content/index.md`
          controls root-level notes. A nested folder does not inherit its parent's setting; give that folder's
          own physical `index.md` the key when it should use the same behavior. Folder rows themselves remain
          first and keep their normal alphabetical ordering.

          The same folder-local policy is applied to physical notes when Quartz lists them in Backlinks and
          standard FolderPage/TagPage page lists. For Backlinks this is based on the folder containing each
          backlink source note, not the folder containing the page being viewed. If one aggregate list contains
          notes from several folders, each folder's notes are sorted only within that folder's existing list
          slots, using that folder's own direction; notes from folders without the key keep their existing slots.
          '''
          if old not in text:
              raise SystemExit("README sorting paragraph not found")
          path.write_text(text.replace(old, new))

          path = Path("CHANGELOG.md")
          text = path.read_text()
          old = '''- Apply the same active filename policy to standard Quartz Backlinks and FolderPage/TagPage
            `PageList` collections while preserving generated or otherwise unknown entries.
          '''
          new = '''- Apply folder-local filename policies to standard Quartz Backlinks and FolderPage/TagPage
            `PageList` collections based on each listed source note's own containing folder, including mixed-folder
            lists, while preserving generated or otherwise unknown entries.
          '''
          if old in text:
              text = text.replace(old, new)
          else:
              text = text.replace('## [0.5.0]', '- Fix Backlinks/list sorting to use each listed source note\'s own folder policy instead of the viewed page\'s folder.\n\n## [0.5.0]')
          path.write_text(text)

          path = Path(".github/instructions/architecture.instructions.md")
          text = path.read_text()
          text = text.replace(
              '  ordinary pages the exact current-folder policy applies; generated `tags` routes use the root\n  policy. The SPA enhancement reorders only sortable direct slots in standard Backlinks lists and\n',
              '  each listed physical note carries the policy from its own exact containing folder. Aggregate\n  lists may therefore contain several independent folder groups. The SPA enhancement reorders only\n  each group\'s existing sortable slots in standard Backlinks lists and\n',
          )
          path.write_text(text)

          path = Path(".github/instructions/verification.instructions.md")
          text = path.read_text()
          text = text.replace(
              '- shared note-list sorting metadata and SPA behavior: exact-folder policy on ordinary pages, root\n  policy on generated tag routes, source-filename rather than title lookup, Backlinks and\n',
              '- shared note-list sorting metadata and SPA behavior: each listed physical source uses its own\n  exact-folder policy (including when the viewed page lives elsewhere), source-filename rather than title lookup, mixed-folder Backlinks/tag lists, and\n',
          )
          path.write_text(text)
          PY

      - name: Format changed files
        run: npx prettier --write src/filenameListSorting.ts src/components/RootIndexSidebar.tsx src/components/scripts/sidebar.inline.ts test/filename-list-sorting.test.ts test/list-sorting-script.test.ts README.md CHANGELOG.md .github/instructions/architecture.instructions.md .github/instructions/verification.instructions.md
      - name: Verify source
        run: npm run typecheck && npm run lint && npm run format && npm test
      - name: Build
        run: npm run build
      - name: Verify package artifacts
        run: npm run verify:dist && npm run verify:package
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "VingGit"
          git config user.email "61470249+VingGit@users.noreply.github.com"
          git add src test dist README.md CHANGELOG.md .github/instructions
          git diff --cached --check
          git commit -m "Fix Backlinks sorting by source folder"
          git push origin main
