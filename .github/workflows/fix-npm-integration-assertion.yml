name: Fix npm integration assertion

on:
  push:
    branches: ["feature/npm-publishing"]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix npm dependency integration expectations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/npm-publishing

      - name: Update FolderPage dependency assertions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const file = "test/integration/parent-build.mjs"
          let text = fs.readFileSync(file, "utf8")
          const before = text
          text = text.replace(
            '      /requires "folder-page"/,',
            String.raw`      /requires "@quartz-community\/folder-page"/,`,
          )
          text = text.replace(
            '      /npx quartz plugin add github:quartz-community\\/folder-page/,',
            String.raw`      /npx quartz plugin add @quartz-community\/folder-page/,`,
          )
          if (text === before) {
            throw new Error("expected stale FolderPage assertions were not found")
          }
          fs.writeFileSync(file, text)
          NODE

      - name: Commit targeted fix
        shell: bash
        run: |
          git diff --check
          git config user.name VingGit
          git config user.email 61470249+VingGit@users.noreply.github.com
          git add test/integration/parent-build.mjs
          git commit -m "fix npm dependency integration expectations"
          git push origin HEAD:feature/npm-publishing
