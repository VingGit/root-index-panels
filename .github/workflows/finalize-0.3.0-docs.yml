name: Finalize 0.3.0 release automation docs

on:
  push:
    branches: ["release/0.3.0-current-lucide"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'finalize 0.3.0 release automation docs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update release automation documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceRequired(path, oldText, newText) {
            const input = fs.readFileSync(path, 'utf8')
            if (!input.includes(oldText)) throw new Error(`Expected text not found in ${path}`)
            fs.writeFileSync(path, input.replace(oldText, newText))
          }

          replaceRequired(
            'README.md',
            `external icon request. The repository checks npm daily and advances the exact Lucide pin to the\nnewest release only after the package checks and Quartz integration suites pass. If a newly released\nicon is unavailable in your checkout, update the plugin before treating the icon as missing.`,
            `external icon request. The repository checks npm daily and advances the exact Lucide pin to the\nnewest release only after the package checks and Quartz integration suites pass. Each successful\nLucide update advances the plugin's minor version, tags that release, publishes it to npm, and creates\nthe matching GitHub release. If a newly released icon is unavailable in your checkout, update the\nplugin before treating the icon as missing.`,
          )

          replaceRequired(
            'CHANGELOG.md',
            `- Add a daily GitHub Actions maintenance job that updates \`lucide-preact\` to the latest npm release, regenerates and verifies the package, runs the Quartz integration suites, and commits only a verified dependency bump to \`main\`.`,
            `- Add a daily GitHub Actions maintenance job that updates \`lucide-preact\` to the latest npm release, regenerates and verifies the package, runs the Quartz integration suites, advances the plugin minor version, tags it, and dispatches the npm/GitHub release pipeline.`,
          )
          NODE

      - name: Format and validate
        run: |
          npm exec -- prettier --write README.md CHANGELOG.md .github/workflows/update-lucide.yml
          npm run check
          git diff --check

      - name: Remove finalizer and commit
        run: |
          rm .github/workflows/finalize-0.3.0-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: describe automatic Lucide minor releases"
          git push origin HEAD:release/0.3.0-current-lucide
