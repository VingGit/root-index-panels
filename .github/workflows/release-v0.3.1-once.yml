name: Release v0.3.1 once

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.event.head_commit.message == 'add one-time v0.3.1 release trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          target="0ae35c68627d642c353ea282b6026a6aaf773eb1"
          git show "$target:package.json" > "$RUNNER_TEMP/package.json"
          node - "$RUNNER_TEMP/package.json" <<'NODE'
          const fs = require("node:fs")
          const packagePath = process.argv[2]
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"))
          if (pkg.name !== "@vinggit/root-index-panels" || pkg.version !== "0.3.1") {
            throw new Error(`unexpected release target: ${pkg.name}@${pkg.version}`)
          }
          NODE

      - name: Create v0.3.1 tag at validated commit
        shell: bash
        run: |
          target="0ae35c68627d642c353ea282b6026a6aaf773eb1"
          git fetch --tags --force
          if git rev-parse "refs/tags/v0.3.1" >/dev/null 2>&1; then
            actual="$(git rev-list -n 1 v0.3.1)"
            if [ "$actual" != "$target" ]; then
              echo "::error::v0.3.1 already points to $actual, expected $target"
              exit 1
            fi
            echo "v0.3.1 already exists at expected target"
          else
            git tag v0.3.1 "$target"
            git push origin refs/tags/v0.3.1
          fi

      - name: Delete merged feature branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/fix/lucide-install-sync >/dev/null 2>&1; then
            git push origin --delete fix/lucide-install-sync
          else
            echo "feature branch already deleted"
          fi

      - name: Dispatch permanent release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref v0.3.1
