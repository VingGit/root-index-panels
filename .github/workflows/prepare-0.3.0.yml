name: Prepare 0.3.0 release

on:
  push:
    branches: ["release/0.3.0-current-lucide"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'prepare 0.3.0 release changes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply 0.3.0 source, docs, and metadata changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceRequired(path, oldText, newText) {
            const input = fs.readFileSync(path, 'utf8')
            if (!input.includes(oldText)) {
              throw new Error(`Expected text not found in ${path}: ${oldText.slice(0, 120)}`)
            }
            fs.writeFileSync(path, input.replace(oldText, newText))
          }

          replaceRequired(
            'src/icons.ts',
            `type LucideWrapperProps = {\n  iconNode?: unknown\n  icon?: unknown\n}`,
            `type LucideWrapperProps = {\n  icon?: unknown\n}`,
          )

          replaceRequired(
            'src/icons.ts',
            `  if (Array.isArray(wrapper.props.iconNode)) {\n    return wrapper.props.iconNode as LucideIconNode\n  }\n\n  const iconData = wrapper.props.icon`,
            `  const iconData = wrapper.props.icon`,
          )

          replaceRequired(
            'src/icons.ts',
            `  throw new TypeError("The lucide-preact icon-node contract changed")`,
            `  throw new TypeError("The current lucide-preact icon data contract changed")`,
          )

          replaceRequired(
            'README.md',
            `color-inheriting SVG masks from jsDelivr using the same exact Lucide version pinned by this plugin.\nThey therefore require the reader's browser and Content Security Policy to allow image requests to\n\`cdn.jsdelivr.net\`. Built-in icons and TypeScript custom icons remain self-contained and make no\nexternal icon request. An icon introduced after the plugin's pinned Lucide version will not render\nuntil the plugin updates Lucide.`,
            `color-inheriting SVG masks from jsDelivr using the same exact Lucide version pinned by this plugin.\nThey therefore require the reader's browser and Content Security Policy to allow image requests to\n\`cdn.jsdelivr.net\`. Built-in icons and TypeScript custom icons remain self-contained and make no\nexternal icon request. The repository checks npm daily and advances the exact Lucide pin to the\nnewest release only after the package checks and Quartz integration suites pass. If a newly released\nicon is unavailable in your checkout, update the plugin before treating the icon as missing.`,
          )

          replaceRequired(
            'README.md',
            `Built-ins are still useful when an icon should work offline, under a restrictive CSP, or as a\ncurated default. The bundled icons come from [Lucide](https://lucide.dev/icons/) through the exact\n\`lucide-preact\` version in \`package.json\`.`,
            `Built-ins are still useful when an icon should work offline, under a restrictive CSP, or as a\ncurated default. The bundled icons come from [Lucide](https://lucide.dev/icons/) through the exact\n\`lucide-preact\` version in \`package.json\`. The plugin intentionally follows the current Lucide\nPreact icon-data representation rather than retaining compatibility shims for older Lucide internals.`,
          )

          replaceRequired(
            'README.md',
            `The command infers \`BookCopy\`, verifies that export exists in the installed pinned\n\`lucide-preact\`, updates the single source of truth in \`src/built-in-icons.json\`, regenerates the\nstatic imports and this README list, formats them, then runs \`check\`, \`build\`, \`verify:dist\`, and\n\`verify:package\`. The generated TypeScript registry and exhaustive generated-registry test no\nlonger require manual editing.`,
            `The command infers \`BookCopy\`, verifies that export exists in the installed pinned\n\`lucide-preact\`, updates the single source of truth in \`src/built-in-icons.json\`, regenerates the\nstatic imports and this README list, formats them, then runs \`check\`, \`build\`, \`verify:dist\`, and\n\`verify:package\`. The generated TypeScript registry and exhaustive generated-registry test no\nlonger require manual editing. If the export is missing locally, the helper compares the pinned\nLucide version with npm's latest release; when the checkout is stale it reports both versions and\nprints the update command before suggesting that the icon name itself may be wrong.`,
          )

          const pkgPath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = '0.3.0'
          pkg.quartz.version = '0.3.0'
          pkg.quartz.components.RootIndexSidebar.version = '0.3.0'
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`)

          const changelogPath = 'CHANGELOG.md'
          const changelog = fs.readFileSync(changelogPath, 'utf8')
          const start = changelog.indexOf('## [Unreleased]')
          const end = changelog.indexOf('## [0.2.2]')
          if (start < 0 || end < 0 || end <= start) throw new Error('Could not locate changelog release block')
          const releaseBlock = `## [Unreleased]\n\n## [0.3.0] - 2026-09-11\n\n### Added\n\n- Add \`user-group\` to the bundled Lucide icon aliases.\n- Add a daily GitHub Actions maintenance job that updates \`lucide-preact\` to the latest npm release, regenerates and verifies the package, runs the Quartz integration suites, and commits only a verified dependency bump to \`main\`.\n\n### Changed\n\n- Update \`lucide-preact\` from 1.25.0 to 1.44.0 and treat Lucide dependency updates as a minor plugin release.\n- Follow only the current Lucide Preact \`icon.node\` representation instead of retaining a compatibility path for the older \`iconNode\` wrapper.\n- Improve \`npm run icon:add -- <name>\` diagnostics when the repository's installed Lucide release is older than the current npm release.\n\n`
          let next = changelog.slice(0, start) + releaseBlock + changelog.slice(end)
          next = next.replace(
            '[unreleased]: https://github.com/VingGit/root-index-panels/compare/v0.2.2...HEAD',
            '[unreleased]: https://github.com/VingGit/root-index-panels/compare/v0.3.0...HEAD\n[0.3.0]: https://github.com/VingGit/root-index-panels/compare/v0.2.2...v0.3.0',
          )
          fs.writeFileSync(changelogPath, next)
          NODE

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Format changed files
        run: npm exec -- prettier --write src/icons.ts README.md CHANGELOG.md package.json package-lock.json

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify dist
        run: npm run verify:dist

      - name: Verify packed package
        run: npm run verify:package

      - name: Check whitespace errors
        run: git diff --check

      - name: Remove preparation workflow and commit
        shell: bash
        run: |
          rm .github/workflows/prepare-0.3.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare 0.3.0"
          git push origin HEAD:release/0.3.0-current-lucide
