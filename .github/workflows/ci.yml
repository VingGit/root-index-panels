name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  materialize-feature:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/folder-filename-sorting'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/folder-filename-sorting

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update feature documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected documentation anchor missing from {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              """The plugin preserves an authored title exactly. If no title exists, it derives one from the
directory name.

Built-in icons:
""",
              """The plugin preserves an authored title exactly. If no title exists, it derives one from the
directory name.

### Folder-local filename sorting

A physical `index.md` can opt the files directly in its own folder into filename-aware sidebar
sorting:

```yaml
---
quartz-sorting-direction: ascending
---
```

Use `descending` to reverse values within each sort class. Putting the key on `content/index.md`
controls root-level notes. A nested folder does not inherit its parent's setting; give that folder's
own physical `index.md` the key when it should use the same behavior. Folder rows themselves remain
first and keep their normal alphabetical ordering.

The sorter reads the source filename, not frontmatter `title`. It recognizes the first valid
`DD.MM.YYYY` date and the first valid `HH-MM` time anywhere in the filename. Dates must be real
Gregorian calendar dates and times must be between `00-00` and `23-59`; invalid-looking tokens are
treated as ordinary filename text.

The file buckets stay in this order for both directions:

1. filenames without a valid date or time;
2. filenames containing both a date and a time;
3. filenames containing a date only; and
4. filenames containing a time only.

Ordinary filenames use natural ordering with numeric runs first, then Unicode uppercase letters,
then Unicode lowercase letters, then other characters. Numeric runs compare by value, so `2` sorts
before `10`. Date-and-time files compare by date and then time, so files sharing a date stay grouped
and their times determine their order. Date-only and time-only files compare their parsed values.
Remaining filename text provides deterministic ties after parsed values are equal.

`ascending` and `descending` reverse values inside those fixed buckets and character classes; they
do not move the date/time buckets ahead of ordinary filenames or move lowercase names ahead of
uppercase names. Missing values, booleans such as `true`/`false`, and any string other than exactly
`ascending` or `descending` preserve the sidebar's normal title-based ordering for that folder.

Built-in icons:
""",
          )

          replace_once(
              "CHANGELOG.md",
              "## [Unreleased]\n",
              """## [Unreleased]

### Added

- Add opt-in folder-local sidebar filename sorting through
  `quartz-sorting-direction: ascending|descending` on physical `index.md` files, with strict
  `DD.MM.YYYY`/`HH-MM` parsing, deterministic natural filename ordering, same-date time grouping,
  and non-inherited folder scope.
""",
          )

          replace_once(
              ".github/instructions/architecture.instructions.md",
              """- Folders sort before leaves, followed by case-insensitive title, exact title, and stable key.
  Ordinary notes, Canvas, and Base use distinct icons.
""",
              """- Folders always sort before leaves and retain case-insensitive title, exact-title, and stable-key
  ordering. A first listed physical folder `index` may opt only that folder's direct file children
  into filename ordering with frontmatter `quartz-sorting-direction: ascending|descending`; the
  physical root `index` controls root notes. The setting never inherits into nested folders, and
  missing or invalid values preserve normal title ordering.
- Filename ordering uses the physical `filePath` basename, with the slug leaf only as the generated
  Canvas/Base fallback. Parse the first valid `DD.MM.YYYY` Gregorian date and `HH-MM` 24-hour time
  anywhere in the name. Keep fixed buckets for plain, date-and-time, date-only, then time-only names.
  Plain names use natural numeric runs plus Unicode uppercase, Unicode lowercase, then other-character
  classes. Direction reverses values inside fixed buckets/classes without reversing their priority;
  date-and-time values compare date then time so equal dates stay grouped. Parsed-value ties use the
  remaining name and then the raw name deterministically. Ordinary notes, Canvas, and Base use
  distinct icons.
""",
          )

          replace_once(
              ".github/instructions/verification.instructions.md",
              """For sidebar inventory, parameterize input order and duplicates. Assert:

- root/book context selection and authored-root fallback;
""",
              """For sidebar inventory, parameterize input order and duplicates. Assert:

- root/book context selection and authored-root fallback;
- folder-local filename sorting from physical `index.md` frontmatter, including root and nested
  scopes, non-inheritance, invalid-value fallback, filename-versus-title independence, strict
  `DD.MM.YYYY`/`HH-MM` validation, natural numeric/Unicode case classes, fixed temporal buckets,
  same-date time grouping, deterministic ties, and both directions;
""",
          )
          PY

      - name: Format feature files
        run: >-
          npx prettier --write
          src/filenameSorting.ts
          src/navigation.ts
          test/filename-sorting.test.ts
          README.md
          CHANGELOG.md
          .github/instructions/architecture.instructions.md
          .github/instructions/verification.instructions.md

      - name: Build distribution
        run: npm run build

      - name: Commit generated feature state
        shell: bash
        run: |
          git config user.name VingGit
          git config user.email 61470249+VingGit@users.noreply.github.com
          git add \
            src/filenameSorting.ts \
            src/navigation.ts \
            test/filename-sorting.test.ts \
            README.md \
            CHANGELOG.md \
            .github/instructions/architecture.instructions.md \
            .github/instructions/verification.instructions.md \
            dist/
          if git diff --cached --quiet; then
            echo "Feature state is already materialized"
            exit 0
          fi
          git commit -m "build: materialize folder filename sorting"
          git push origin HEAD:feature/folder-filename-sorting

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format feature files for artifact generation
        run: npx prettier --write src/filenameSorting.ts src/navigation.ts test/filename-sorting.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload generated feature files
        uses: actions/upload-artifact@v4
        with:
          name: folder-filename-sorting-generated
          path: |
            src/filenameSorting.ts
            src/navigation.ts
            test/filename-sorting.test.ts
            dist/

      - name: Verify dist is up to date
        run: |
          if git diff --quiet dist/; then
            echo "dist/ is up to date"
          else
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            git diff --stat dist/
            exit 1
          fi

      - name: Verify dist externals
        run: npm run verify:dist

      - name: Verify packed package
        run: npm run verify:package

      # The same commit already runs these expensive host-level checks when pushed to main.
      # Release tags skip them and instead verify below that the tagged commit is contained in main.
      - name: Prepare configured Quartz integration host
        if: github.ref_type != 'tag'
        run: |
          host="$RUNNER_TEMP/quartz-for-gitlab"
          git clone --depth 1 https://gitlab.utu.fi/obsidian/quartz-for-gitlab.git "$host"
          npm ci --prefix "$host"
          npm install --prefix "$host" --no-save @quartz-community/folder-page@0.1.0
          (
            cd "$host"
            npx quartz plugin install --from-config
          )
          echo "RIP_QUARTZ_ROOT=$host" >> "$GITHUB_ENV"
          echo "Configured Quartz host revision: $(git -C "$host" rev-parse HEAD)"

      - name: Run configured Quartz integration
        if: github.ref_type != 'tag'
        run: npm run test:integration

      - name: Run watch-mode integration
        if: github.ref_type != 'tag'
        run: npm run test:watch-integration

      - name: Verify npm pack dry run
        run: npm pack --dry-run

      - name: Check whitespace errors
        run: git diff --check

  windows-maintainer-tools:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify stale Lucide diagnostics on Windows
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installedVersion = $package.dependencies.'lucide-preact'
          $package.dependencies.'lucide-preact' = '0.0.0'
          $package | ConvertTo-Json -Depth 20 | Set-Content package.json

          $output = & npm run icon:add -- file-question-mark 2>&1
          $status = $LASTEXITCODE
          $text = $output | Out-String
          $text | Write-Host
          git restore package.json

          if ($status -eq 0) {
            throw 'icon:add unexpectedly accepted a stale dependency tree'
          }
          if (-not $text.Contains('Dependency mismatch:')) {
            throw 'icon:add did not report the dependency mismatch clearly'
          }
          if (-not $text.Contains('package.json requires lucide-preact 0.0.0')) {
            throw 'icon:add did not report the required Lucide version'
          }
          if (-not $text.Contains("node_modules contains lucide-preact $installedVersion")) {
            throw 'icon:add did not report the actually installed Lucide version'
          }
          if (-not $text.Contains('npm ci')) {
            throw 'icon:add did not print the npm ci recovery command'
          }
          git diff --exit-code -- src/built-in-icons.json src/built-in-icons.generated.ts README.md

      - name: Verify icon helper and packed-package check on Windows
        run: npm run icon:add -- file-question-mark

  # npm authenticates this job through GitHub OIDC Trusted Publishing; no npm token is required.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tagged commit is contained in main
        shell: bash
        run: |
          release_commit="$(git rev-parse HEAD)"
          git fetch origin main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME points to $release_commit, which is not contained in main"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish to npm with trusted publishing
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published; skipping npm publish"
          else
            npm publish --access public
          fi

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; skipping creation"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
